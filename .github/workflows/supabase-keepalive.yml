name: Supabase project keepalive

on:
  schedule:
    # Every two days at 21:00 UTC (06:00 JST the next day).
    - cron: '0 21 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping reusable Supabase project
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY is not configured."
            exit 1
          fi

          STATUS=$(curl --silent --output /tmp/supabase-keepalive-body.txt --write-out "%{http_code}" \
            "https://vdntqwtywxyjxelycavx.supabase.co/rest/v1/keepalive_ping?select=id&limit=1" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Supabase keepalive failed (HTTP $STATUS). Restore the project from the dashboard if it is paused."
            exit 1
          fi
